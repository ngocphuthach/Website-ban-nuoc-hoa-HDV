services:
  web:
    build: .
    container_name: perfumestore-soa
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: perfumestore
      DB_USER: root
      DB_PASS: root
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: perfumestore-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: perfumestore
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
